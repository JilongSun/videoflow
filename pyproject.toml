[project]
name = "videoflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "dashscope>=1.25.12",
    "fastapi>=0.128.0",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.2.8",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
    "lark-oapi>=1.5.3",
    "loguru>=0.7.3",
    "mcp>=1.26.0",
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.90",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "runwayml>=4.5.0",
    "tikhub-sdk-v2",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
build = ["nuitka>=2.8.10"]
vllm = ["torch>=2.8.0", "torchvision>=0.23.0", "vllm==0.11.0"]


[tool.uv.sources]
tikhub-sdk-v2 = { git = "https://github.com/TikHub/TikHub-API-Python-SDK-V2.git" }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
